name: macPad macOS Build Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Inspect macOS build environment
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Show macOS and developer tools
        run: |
          set -eu
          sw_vers
          uname -m
          xcode-select -p
          clang --version
          python3 --version
          git --version

      - name: Check project build requirements
        run: |
          set -eu
          test -f Makefile
          test -f config/production.mk
          test -f MacWSWindowing/Makefile
          test -f misc/macws_artifact_contract.py
          test -f misc/deploy_macwswindowing.sh
          test -f misc/build.sh
          echo "Required project files are present."
          echo "This workflow does not build, package, or deploy anything."

      - name: Read-only check of build tools and SDKs
        run: |
          set -eu

          echo "=== Build tools ==="
          for tool in xcodebuild xcrun clang python3 git; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "FOUND: $tool -> $(command -v "$tool")"
            else
              echo "MISSING: $tool"
            fi
          done

          echo "=== Xcode SDKs ==="
          xcodebuild -showsdks

          echo "=== macOS SDK path ==="
          xcrun --sdk macosx --show-sdk-path

          echo "=== Optional linker tools ==="
          for tool in gmake ld64 dyld_info otool; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "FOUND: $tool -> $(command -v "$tool")"
            else
              echo "MISSING: $tool"
            fi
          done

          echo "=== Theos and project configuration ==="
          grep -nE 'THEOS|TARGET|ARCHS|MACWS_WINDOWING_CROSS_PREBUILT|dyld_info|FINALPACKAGE|OPTFLAG' \
            Makefile MacWSWindowing/Makefile config/production.mk \
            misc/build.sh misc/deploy_macwswindowing.sh
